<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
</head>
<style>
    .modal {
    }
</style>
<body>
    <h1>Employee Management</h1>

    <button id="addEmployeeBtn">Add Employee</button>

    <div id="addModal" class="modal">

        <div class="modalContent">
            <h2>Add Employee</h2>

            <main>
                <form id="employeeForm">
                    <div>
                        <label for="fullname">Full name: </label>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            required
                            minlength="2"
                            maxlength="100"
                            pattern="[A-Za-zÀ-ÿ\s]+"
                            title="Name should contain letters and spaces only."
                            >
                    </div>
            
                    <div>
                        <label for="email">Email: </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            maxlength="100"
                            >
                    </div>
            
                    <div>
                        <label for="phone">Phone: </label>
                        <input 
                            type="tel"
                            id="phone"
                            required
                            pattern="09[0-9]{9}"
                            maxlength="11"
                            placeholder="Ex. 0912345678"
                            title="Enter an 11-digit Philippine mobile number starting with 09."
                            >
                    </div>
            
                    <div>
                        <label for="position">Position: </label>
                        <input
                            type="text"
                            id="position"
                            name="position"
                            required
                            minlength="2"
                            maxlength="100"
                            >
                    </div>
            
                    <div>
                        <label for="department">Department: </label>
                        <input
                            type="text"
                            id="department"
                            name="department"
                            required
                            minlength="2"
                            maxlength="100"
                            >
                    </div>
            
                    <div>
                        <label for="basic_salary">Basic Salary</label>
                        <input
                            type="number"
                            id="basic_salary"
                            name="basic_salary"
                            required
                            min="1"
                            step="0.01">
                    </div>
                </form>
            </main>
        </div>

    </div>

    <table id="employeeTable">

        <thead>
            <tr>
                <th>ID</th>
                <th>fullname</th>
                <th>email</th>
                <th>phone</th>
                <th>position</th>
                <th>department</th>
                <th>basic_salary</th>
                <th>status</th>
                <th>created_at</th>

            </tr>
        </thead>

        <tbody id="tbody">

        </tbody>

    </table>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="module" src="../js/employees.js"></script>
</body>
</html>
