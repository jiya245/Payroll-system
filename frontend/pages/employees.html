<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
</head>
<style>
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
}

.modalContent {
    background: white;
    width: 400px;
    margin: 50px auto;
    padding: 20px;
}
    #message {
    display: none;
    padding: 10px;
    margin-bottom: 10px;
}

#message.success {
    display: block;
    background: lightgreen;
}

#message.error {
    display: block;
    background: lightcoral;
}
</style>
<body>

    <div id="message"></div>

    <h1>Employee Management</h1>

    <button id="addEmployeeBtn">Add Employee</button>

    <div id="addModal" class="modal">

        <div class="modalContent">
            <h2>Add Employee</h2>

            <main>
                <form id="employeeForm">
                    <div>
                        <label for="fullname">Full name: </label>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            required
                            minlength="2"
                            maxlength="100"
                            pattern="[A-Za-zÀ-ÿ\s]+"
                            title="Name should contain letters and spaces only."
                            >
                    </div>
            
                    <div>
                        <label for="email">Email: </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            maxlength="100"
                            >
                    </div>
            
                    <div>
                        <label for="phone">Phone: </label>
                        <input 
                            name="phone"
                            type="tel"
                            id="phone"
                            required
                            pattern="09[0-9]{9}"
                            maxlength="11"
                            placeholder="Ex. 09123456789"
                            title="Enter an 11-digit Philippine mobile number starting with 09."
                            >
                    </div>
            
                    <div>
                        <label for="position">Position: </label>
                        <input
                            type="text"
                            id="position"
                            name="position"
                            required
                            minlength="2"
                            maxlength="100"
                            >
                    </div>
            
                    <div>
                        <label for="department">Department: </label>
                        <input
                            type="text"
                            id="department"
                            name="department"
                            required
                            minlength="2"
                            maxlength="100"
                            >
                    </div>
            
                    <div>
                        <label for="basic_salary">Basic Salary</label>
                        <input
                            type="number"
                            id="basic_salary"
                            name="basic_salary"
                            required
                            min="1"
                            step="0.01">
                    </div>

                    <div>
                        <label for="status">Status: </label>
                        <select id="status" name="status" required>
                            <option value="">Select status</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <button type="submit">Add Employee</button>
                    <button type="button" id="cancelAddBtn">Cancel</button>
                </form>
            </main>
        </div>

    </div>

    <div id="editModal" class="modal">

        <div class="modalContent">
    
            <h2>Edit Employee</h2>
    
            <form id="editEmployeeForm">
    
                <input type="hidden" id="editId" name="id">
    
                <div>
                    <label for="editFullname">Full name:</label>
                    <input
                        type="text"
                        id="editFullname"
                        name="fullname"
                        required
                        minlength="2"
                        maxlength="100"
                    >
                </div>
    
                <div>
                    <label for="editEmail">Email:</label>
                    <input
                        type="email"
                        id="editEmail"
                        name="email"
                        required
                        maxlength="100"
                    >
                </div>
    
                <div>
                    <label for="editPhone">Phone:</label>
                    <input
                        type="tel"
                        id="editPhone"
                        name="phone"
                        required
                        pattern="09[0-9]{9}"
                        maxlength="11"
                    >
                </div>
    
                <div>
                    <label for="editPosition">Position:</label>
                    <input
                        type="text"
                        id="editPosition"
                        name="position"
                        required
                        minlength="2"
                        maxlength="100"
                    >
                </div>
    
                <div>
                    <label for="editDepartment">Department:</label>
                    <input
                        type="text"
                        id="editDepartment"
                        name="department"
                        required
                        minlength="2"
                        maxlength="100"
                    >
                </div>
    
                <div>
                    <label for="editSalary">Basic Salary:</label>
                    <input
                        type="number"
                        id="editSalary"
                        name="basic_salary"
                        required
                        min="1"
                        step="0.01"
                    >
                </div>
    
                <div>
                    <label for="editStatus">Status:</label>
    
                    <select id="editStatus" name="status" required>
                        <option value="">Select status</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
    
                <button type="submit">Save Changes</button>
                <button type="button" id="cancelEditBtn">Cancel</button>
    
            </form>
    
        </div>
    
    </div>

    <div id="deleteModal" class="modal">

        <div class="modalContent">
    
            <h2>Delete Employee</h2>
    
            <p id="deleteMessage">Are you sure you want to delete this employee?</p>
            <input type="hidden" id="deleteId" name="Id">

            <button type="button" id="confirmDeleteBtn">Delete</button>
            <button type="button" id="cancelDeleteBtn">Cancel</button>
    
        </div>
    
    </div>

    <div id="searchFeature">
        <label>Search: </label>
        <input type="textd" id="searchInp" placeholder="Search employee">
    </div>

    <table id="employeeTable">

        <thead>
            <tr>
                <th>ID</th>
                <th>fullname</th>
                <th>email</th>
                <th>phone</th>
                <th>position</th>
                <th>department</th>
                <th>basic_salary</th>
                <th>status</th>
                <th>created_at</th>
                <th>Actions</th>

            </tr>
        </thead>

        <tbody id="tbody">

        </tbody>

    </table>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../js/employees.js"></script>
    </body>
</html>
